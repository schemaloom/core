name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:eval
      - run: npm test
      # Offline harness smoke test: deterministic stub target, no API key needed.
      - run: npm run eval -- --target stub --split all --repeats 1 --no-cache --label ci_stub
